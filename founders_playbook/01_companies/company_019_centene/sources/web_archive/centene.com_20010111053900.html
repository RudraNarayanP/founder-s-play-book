      <h3 align="left"><font color="#000066"><i><font face="Times New Roman, Times, serif"> 
        <b>Why CENTENE? </b></font></i></font></h3>
      <p><font color="#000066"><font face="Times New Roman, Times, serif">Here 
        are nine good reasons</font><i><font face="Times New Roman, Times, serif">. 
        </font></i></font></p>
    </td>

    <td ALIGN=Left VALIGN=Top height="154" width="275"> <img src="images/read2.jpg" width="220" height="147"></td>
</tr>

<TR>
    <TD COLSPAN=2> <font color="#000066"><font face="Times New Roman, Times, serif"> 
      <B>Experience in Government Sector.</B> For 15 years, CENTENE has been successful 
      in providing health care coverage for Medicaid participants in Wisconsin, 
      Indiana and Illinois. It is moving to open Medicaid and Medicare products 
      in Texas. <BR>
      <BR>
      <B>Solid Government Relations.</B> Recognizing the importance of cooperative 
      relationships, CENTENE has developed strong working relationships with federal, 
      state and local government officials, who all play an important role in 
      supporting and monitoring the Medicaid program and other government supported 
      health care programs. <BR>
      <BR>
      <B>Provider Driven.</B> CENTENE has a policy of involving its providers 
      in its operations. It believes a profitable managed care company must listen 
      and work closely with its provider network. The company has demonstrated 
      its ability to work with independent doctors, group practices, clinics, 
      hospitals, public health and Federally Qualified Health Centers. <BR>
      <BR>
      <B>Strong Financial Backing.</B> Along with its original investment partner, 
      Greylock, CENTENE has welcomed new investment partners - Cahill Warnock 
      & Company and Quantum Industrial Holdings, Ltd. (Soros Fund) - to the company. 
      <BR>
      <BR>
      <B>State-of-the-Art Information Systems.</B> CENTENE provides a complete, 
      fully-functional, integrated management information system, with all sub-systems 
      customized for Medicaid use. The system is fully capable of handling CENTENE's 
      current Medicaid and commercial products, as well as accommodating growth 
      into the Medicare market. The flexibility of the information system is adaptable 
      to different state and local provider and government requirements. <BR>
      <BR>
      <B>Innovative Comunity Outreach.</B> Important to the success of providing 
      government-supported health care programs is the ability to communicate, 
      motivate and assist persons receiving health care coverage. CENTENE has 
      a unique outreach program called "CONNECTIONS." The program focuses on assisting 
      Medicaid members in accessing their health care and directing them to social 
      services within the community that meet their particular needs. <BR>
      <BR>
      <B>Culturally Diverse Staff.</B> All CENTENE Plans have a culturally diverse 
      staff who are committed to providing comprehensive, quality health care 
      for all their members. Each Plan conducts its business in at least two languages 
      (English and Spanish) at the staff level. <BR>
      <BR>
      <B>Members Come First.</B> CENTENE prides itself in ensuring its members 
      are satisfied with its services. Its Plans' Member Services Departments 
      are uniquely structured to respond in a timely and comprehensive manner 
      to member needs. CENTENE also has a 24-hour medical hotline (NurseWise) 
      accessible to all members. <BR>
      <BR>
      <B>Community Involvement.</B> The company and its Plans take pride in providing 
      both personal and financial participation to support the communities they 
      serve. </font> </font></TD>
