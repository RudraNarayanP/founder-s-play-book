   var today=new Date();
   var time_display = today.getHours()
   var year_display = today.getYear()
   if (year_display <1000) {
	year_display = year_display + 1900;
	}
	   
   if(today.getMinutes() < 10){
       time_display +=":0" + today.getMinutes();
   }
   else{
       time_display+=":" + today.getMinutes();
   }
   
   if (today.getSeconds() < 10){
       time_display+=":0" + today.getSeconds();
   }

       time_display+=":" + today.getSeconds();
   }

   }

		document.write(date_display);   
}

		document.write(time_display);   
}
